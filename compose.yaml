services:
  aidol:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      APP_TOKEN: "${APP_TOKEN:?Set APP_TOKEN in .env before starting Docker}"
      DATABASE_PATH: /app/data/aidol.sqlite3
    volumes:
      - aidol-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  aidol-data:

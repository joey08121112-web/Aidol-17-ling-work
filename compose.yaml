services:
  aidol:
    build: .
    ports:
      - "127.0.0.1:8108:8108"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8108"
      AIDOL_DATA_DIR: /app/data/hosted
    volumes:
      - aidol-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8108/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  aidol-data:

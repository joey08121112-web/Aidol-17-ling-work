name: verify
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: node --test tests/audio-worklet.test.mjs tests/audio-session.test.mjs
      - run: python -m compileall -q app
      - run: node --check web/app.js
      - run: node --check web/memory.js
  launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install using the Windows launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: ./start.ps1 -InstallOnly
      - name: Verify Windows imports
        if: runner.os == 'Windows'
        shell: powershell
        run: ./.venv/Scripts/python.exe -c "import app.main"
      - name: Install using the Linux and macOS launcher
        if: runner.os != 'Windows'
        run: ./start.sh --install-only
      - name: Verify Unix imports and shell entry points
        if: runner.os != 'Windows'
        run: |
          sh -n start.sh start.command scripts/start.sh
          ./.venv/bin/python -c 'import app.main'
          ./start.command --check

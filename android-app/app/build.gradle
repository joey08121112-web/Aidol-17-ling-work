plugins { id 'com.android.application' }

// Keep review APKs and generated package names separate from normal debug builds.
if (project.hasProperty('aidolVisualReview')) {
    layout.buildDirectory = file('build-visual-review')
}

android {
    namespace 'com.aidol.demo'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aidol.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner (project.hasProperty('aidolAvatarReview') ? 'com.aidol.demo.AvatarReviewInstrumentation' : project.hasProperty('aidolNavigationReview') ? 'com.aidol.demo.NavigationInstrumentation' : project.hasProperty('aidolWorkCommuteUiReview') ? 'com.aidol.demo.WorkCommuteUiInstrumentation' : project.hasProperty('aidolModeSwitchReview') ? 'com.aidol.demo.ModeSwitchInstrumentation' : project.hasProperty('aidolEarconReview') ? 'com.aidol.demo.EarconInstrumentation' : project.hasProperty('aidolCommuteReview') ? 'com.aidol.demo.CommuteInstrumentation' : project.hasProperty('aidolLocationCacheReview') ? 'com.aidol.demo.LocationCacheInstrumentation' : project.hasProperty('aidolWorkAudioReview') ? 'com.aidol.demo.WorkAudioInstrumentation' : project.hasProperty('aidolWorkFixesReview') ? 'com.aidol.demo.WorkFixesInstrumentation' : 'com.aidol.demo.VisualReviewInstrumentation')
        buildConfigField 'String', 'SERVER_URL', '"' + (project.findProperty('aidolServerUrl') ?: 'https://123.207.219.174:7776') + '"'
    }
    buildFeatures { buildConfig true }
    if (project.hasProperty('aidolVisualReview') && project.hasProperty('aidolAvatarReview')) {
        // Automated fixtures have no launcher icon, so an unfinished test install cannot
        // be mistaken for the developer's signed-in app.
        sourceSets.debug.manifest.srcFile 'src/avatarReview/AndroidManifest.xml'
    }
    signingConfigs {
        release {
            if (System.getenv('AIDOL_KEYSTORE')) {
                storeFile file(System.getenv('AIDOL_KEYSTORE'))
                storePassword System.getenv('AIDOL_KEYSTORE_PASSWORD')
                keyAlias 'aidol-release'
                keyPassword System.getenv('AIDOL_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // An isolated install for offline UI fixtures; never reuses a developer account.
            applicationIdSuffix (project.hasProperty('aidolVisualReview')
                ? (project.hasProperty('aidolAvatarReview') ? '.avatartest' : '.review') : '.debug')
            versionNameSuffix '-dev'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation files('libs/headsetSdk-release-6.7.aar')
    implementation 'com.polidea.rxandroidble2:rxandroidble:1.18.1'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.17'
    implementation 'net.java.dev.jna:jna:5.6.0@aar'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

// A fixed external vendor artifact is required on every developer machine; never substitute a newer AAR silently.
tasks.register('verifyRiseSdk') {
    doLast {
        def sdk = file('libs/headsetSdk-release-6.7.aar')
        if (!sdk.isFile()) throw new GradleException('Missing Rise SDK 6.7. Run scripts/import-rise-sdk.ps1 or scripts/import-rise-sdk.sh with demo_6_7.zip.')
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(sdk.bytes).encodeHex().toString()
        if (hash != 'e074506fd3a46346272fdd2ab632a59b4cef2597f4cb37fd160737eb536e2b2c')
            throw new GradleException('Rise SDK checksum mismatch. Obtain the pinned official demo_6_7.zip.')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyRiseSdk' }

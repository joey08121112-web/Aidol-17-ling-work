<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen3-Omni Web Demo</title>
  <script>
    // 主题引导：必须在样式表生效前定好 data-theme，否则会先闪一帧浅色再变深色。
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("qwen_omni_demo_theme"); } catch (err) { stored = null; }
      var systemDark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var theme = (stored === "dark" || stored === "light") ? stored : (systemDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/style.css?v=20261015-theme">
</head>
<body>
  <main class="app">
    <section id="callHero" class="call-hero" aria-labelledby="callHeroTitle">
      <div class="call-hero-bg" aria-hidden="true"></div>
      <div class="call-hero-content">
        <div class="call-visual" aria-hidden="true">
          <div class="call-orbit call-orbit-aura"></div>
          <div class="call-orbit call-orbit-one"></div>
          <div class="call-orbit call-orbit-two"></div>
          <div class="call-orbit call-orbit-scan"></div>
          <div class="call-bars">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="call-avatar">
            <div class="call-avatar-glow"></div>
            <div class="call-avatar-face">
              <video
                src="/assets/zhayanv2.mp4"
                autoplay
                muted
                loop
                playsinline
              ></video>
            </div>
          </div>
        </div>
        <div class="call-copy">
          <p id="heroCallState" class="call-state">未连接</p>
          <h2 id="callHeroTitle">端到端<span>语音进语音出</span>的实时对话。</h2>
          <p class="call-subtitle">千问AI平台 Qwen-Omni-Realtime ｜ 实时语音进语音出</p>
          <button id="heroConnectBtn" class="hero-call-btn" type="button">
            <span class="hero-call-btn-bg" aria-hidden="true"></span>
            <span class="hero-call-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7A2 2 0 0 1 22 16.9Z"/>
              </svg>
            </span>
            <span id="heroConnectRail" class="hero-call-rail" aria-hidden="true"></span>
            <span id="heroConnectText" class="hero-call-text">开始通话</span>
          </button>
        </div>
      </div>
    </section>

    <section id="callPage" class="call-page" hidden aria-labelledby="callPageTitle">
      <div id="reconnectBar" class="reconnect-bar" role="status" aria-live="polite" hidden>
        <span id="reconnectText" class="reconnect-text"></span>
        <button id="reconnectNowBtn" type="button" class="link-btn">立即重连</button>
        <button id="reconnectCancelBtn" type="button" class="link-btn">取消</button>
      </div>
      <div class="call-shell">
        <div class="call-profile">
          <div class="call-profile-visual">
            <div class="call-profile-avatar">
              <video
                src="/assets/zhayanv2.mp4"
                autoplay
                muted
                loop
                playsinline
              ></video>
            </div>
            <div class="call-bubble">
              <strong id="callStateBubble">连接中</strong>
              <span class="call-bubble-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            </div>
          </div>
          <h1 id="callPageTitle">小Q</h1>
          <p id="callDuration" class="call-duration">00:00</p>
          <p class="call-skills">实时全双工语音对话 ｜ 随时插话打断<br>支持本机文件 Function Calling</p>
          <p id="recordHint" class="call-mic-label" hidden></p>
        </div>

        <div class="call-qa-panel">
          <div class="panel-head call-live-head">
            <h2>QA 展示</h2>
            <input id="qaSearchInput" class="qa-search-input" type="search" placeholder="搜索 QA">
            <span id="qaSearchStatus" class="qa-search-status"></span>
            <details id="exportMenu" class="export-menu">
              <summary class="export-summary" aria-label="导出通话记录" title="导出通话记录">导出</summary>
              <div class="export-menu-list" role="menu">
                <button id="exportMarkdownBtn" type="button" role="menuitem">导出 Markdown</button>
                <button id="exportJsonBtn" type="button" role="menuitem">导出 JSON</button>
              </div>
            </details>
            <button id="clearMessagesBtn" type="button" class="link-btn">清空展示</button>
          </div>
          <div id="messages" class="messages"></div>
        </div>

        <div class="call-controls">
          <button id="recordBtn" class="call-control-btn mic-on" type="button" disabled aria-label="关闭麦克风" title="关闭麦克风">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Z"/>
              <path d="M19 11a7 7 0 0 1-14 0"/>
              <path d="M12 18v4"/>
              <path d="M8 22h8"/>
              <path class="mic-off-slash" d="M4 20 20 4"/>
            </svg>
          </button>
          <button
            id="forceCommitBtn"
            class="call-control-btn commit"
            type="button"
            disabled
            aria-label="强制判停"
            title="强制判停，仅在模型未自动判停、迟迟不回复时使用"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v7l4 2"/>
              <path d="M5.6 5.6a9 9 0 1 1-1.7 10.1"/>
              <path d="M3 5v5h5"/>
            </svg>
          </button>
          <button id="callCloseBtn" class="call-control-btn hangup" type="button" aria-label="关闭通话" title="关闭通话">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2v10"/>
              <path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>
            </svg>
          </button>
        </div>
        <p class="force-commit-tip">模型迟迟不回复时，点中间按钮强制判停</p>
        <div id="waveform" class="call-meter waveform" role="img" aria-label="麦克风实时音量波形"></div>
        <p class="call-disclaimer">内容均由人工智能模型生成，不代表平台立场</p>
      </div>
    </section>

    <div
      id="leftResizeHandle"
      class="column-resizer left-resizer"
      role="separator"
      aria-orientation="vertical"
      aria-label="调整参数区和通话区宽度"
      tabindex="0"
    ></div>

    <section class="panel settings">
      <div class="title-row">
        <div>
          <h1>Qwen-Omni Web Demo</h1>
          <p>实时语音对话 + 本机文件 Function Calling</p>
        </div>
        <div class="title-actions">
          <span id="status" class="status">未连接</span>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色 / 浅色模式">
            <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
            </svg>
            <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
          </button>
        </div>
      </div>

      <label>
        <span>API Key</span>
        <span class="secret-input">
          <input id="apiKey" type="password" autocomplete="off" placeholder="千问AI平台申请的 API Key">
          <button id="toggleApiKeyBtn" type="button" aria-label="显示 API Key" title="显示 API Key">
            <svg class="eye-icon eye-show" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M2.06 12.35a1 1 0 0 1 0-.7C3.7 7.18 7.9 4 12 4s8.3 3.18 9.94 7.65a1 1 0 0 1 0 .7C20.3 16.82 16.1 20 12 20s-8.3-3.18-9.94-7.65Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-icon eye-hide" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M2.06 12.35a1 1 0 0 1 0-.7C3.7 7.18 7.9 4 12 4s8.3 3.18 9.94 7.65a1 1 0 0 1 0 .7C20.3 16.82 16.1 20 12 20s-8.3-3.18-9.94-7.65Z"/>
              <circle cx="12" cy="12" r="3"/>
              <path d="M4 20 20 4"/>
            </svg>
          </button>
        </span>
        <span id="apiKeyError" class="field-error" hidden>请先填写 API Key，再点击连接</span>
      </label>

      <label>
        <span>音色</span>
        <select id="voice">
          <option value="Tina">Tina</option>
          <option value="Dylan">Dylan</option>
          <option value="Sunny">Sunny</option>
          <option value="Serena">Serena</option>
          <option value="longanlingxin">龙安灵心 longanlingxin</option>
        </select>
      </label>

      <label>
        <span class="label-row">
          自定义 SP（System prompt）
          <span class="tools-json-actions">
            <button id="resetInstructionsBtn" type="button" class="link-btn">恢复默认</button>
          </span>
        </span>
        <textarea id="instructions" rows="22"></textarea>
      </label>

      <label>
        <span class="label-row">
          FC Tools JSON
          <span class="tools-json-actions">
            <button id="validateToolsBtn" type="button" class="link-btn">校验 JSON</button>
            <button id="formatToolsBtn" type="button" class="link-btn">格式化 JSON</button>
            <button id="resetToolsBtn" type="button" class="link-btn">恢复默认</button>
          </span>
        </span>
        <textarea id="toolsJson" rows="10"></textarea>
        <span id="toolsJsonStatus" class="tools-json-status" aria-live="polite"></span>
      </label>

      <div class="actions">
        <button id="connectBtn" type="button" hidden>连接</button>
        <button id="closeBtn" type="button" hidden disabled>断开</button>
        <label class="check">
          <input id="enableTools" type="checkbox">
          <span>启用本地文件 FC</span>
        </label>
      </div>
    </section>

    <div
      id="rightResizeHandle"
      class="column-resizer right-resizer"
      role="separator"
      aria-orientation="vertical"
      aria-label="调整通话区和事件区宽度"
      tabindex="0"
    ></div>

    <section class="workspace">
      <aside class="panel side">
        <div class="panel-head side-head">
          <h2>交互事件</h2>
          <button id="clearEventsBtn" type="button" class="link-btn">清空事件</button>
        </div>
        <pre id="events"></pre>
      </aside>
    </section>
  </main>
  <div id="errorToast" class="error-toast" role="alertdialog" aria-live="assertive" aria-modal="true" hidden>
    <div class="error-dialog">
      <div class="error-dialog-head">
        <strong id="errorToastTitle">操作失败</strong>
        <button id="errorToastCloseBtn" type="button" aria-label="关闭错误提示" title="关闭错误提示">×</button>
      </div>
      <p id="errorToastMessage"></p>
    </div>
  </div>
  <script src="/app.js?v=20261015-theme"></script>
</body>
</html>

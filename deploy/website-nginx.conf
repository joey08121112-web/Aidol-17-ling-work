# Aidol public product website. Managed by deploy/website-install.sh.
# Dedicated static port; the Android API and existing sites keep their configuration.
server {
    listen 6655;
    listen [::]:6655;
    server_name 123.207.219.174;

    root /opt/aidol/website/current;
    index index.html;
    autoindex off;
    server_tokens off;
    access_log /var/log/nginx/aidol-website-access.log;
    error_log /var/log/nginx/aidol-website-error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /downloads/aidol-android.apk {
        alias /opt/aidol/downloads/aidol-android.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="aidol-android.apk"';
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /downloads/aidol-android.apk.sha256 {
        alias /opt/aidol/downloads/aidol-android.apk.sha256;
        default_type text/plain;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
    }

    location /downloads/ { return 404; }

    location = /index.html {
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
}

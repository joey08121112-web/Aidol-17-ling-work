# Dedicated app port; existing port 80/443 websites are unchanged.
server {
    listen 7776 ssl;
    server_name 123.207.219.174;
    ssl_certificate /opt/aidol/shared/tls/server.pem;
    ssl_certificate_key /opt/aidol/shared/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AidolTLS:1m;
    ssl_session_timeout 1d;
    client_max_body_size 2m;
    client_body_timeout 20s;
    access_log /var/log/nginx/aidol-access.log;
    error_log /var/log/nginx/aidol-error.log;
    add_header X-Content-Type-Options nosniff always;

    location /downloads/ {
        alias /opt/aidol/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8108;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace rather than append public client input; loopback proxy is trusted.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}

# APK distribution only. Browsers do not trust the app's private test CA.
# No API or credential handling is exposed through plain HTTP.
server {
    listen 80;
    server_name 123.207.219.174;
    access_log /var/log/nginx/aidol-downloads-access.log;
    location /downloads/ {
        alias /opt/aidol/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    location / { return 404; }
}
